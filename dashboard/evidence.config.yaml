appearance:
  default: system
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#1B4332"
        - "#2D6A4F"
        - "#D9A441"
        - "#8B5E34"
        - "#5C8A6A"
        - "#C9B896"
      dark:
        - "#8FC1A9"
        - "#52B788"
        - "#E8A838"
        - "#C9B896"
        - "#40916C"
        - "#D9A441"
  colorScales:
    default:
      light:
        - "#EDF2E7"
        - "#1B4332"
      dark:
        - "#132019"
        - "#8FC1A9"
  colors:
    primary:
      light: "#1B4332"
      dark: "#8FC1A9"
    accent:
      light: "#B45309"
      dark: "#E8A838"
    base:
      light: "#FAF7F0"
      dark: "#101613"
    info:
      light: "#1D6FA5"
      dark: "#7DD3FC"
    positive:
      light: "#2D6A4F"
      dark: "#4ADE80"
    warning:
      light: "#92600A"
      dark: "#FBBF24"
    negative:
      light: "#B3261E"
      dark: "#F87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }

deployment:
  basePath: /palm-analytics-dbt
