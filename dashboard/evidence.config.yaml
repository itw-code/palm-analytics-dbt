appearance:
  default: light
  switcher: true

theme:
  colorPalettes:
    default:
      light:
        - "#1F7A80"
        - "#8C4A6B"
        - "#3F6B52"
        - "#7A5F28"
        - "#5B636B"
        - "#C9C1B2"
      dark:
        - "#7EB8BC"
        - "#C489A4"
        - "#8FBF9C"
        - "#D4B46A"
        - "#A8B0B6"
        - "#8C4A6B"
  colorScales:
    default:
      light:
        - "#F7F4EE"
        - "#1F7A80"
      dark:
        - "#0F141A"
        - "#7EB8BC"
  colors:
    primary:
      light: "#1F7A80"
      dark: "#7EB8BC"
    accent:
      light: "#8C4A6B"
      dark: "#C489A4"
    base:
      light: "#F7F4EE"
      dark: "#0F141A"
    info:
      light: "#1F7A80"
      dark: "#7EB8BC"
    positive:
      light: "#3F6B52"
      dark: "#8FBF9C"
    warning:
      light: "#7A5F28"
      dark: "#D4B46A"
    negative:
      light: "#9B4A44"
      dark: "#E09A94"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }

deployment:
  basePath: /palm-analytics-dbt
