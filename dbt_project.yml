name: 'palm_analytics'
version: '1.0.0'
config-version: 2

profile: 'palm_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  palm_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Incremental fact is the only large growing table; keep it table + incremental config per model.
      fct_estate_operations_daily:
        +incremental_strategy: delete+insert
        +on_schema_change: sync_all_columns

seeds:
  palm_analytics:
    +column_types:
      planted_hectares: double
      yield_t_ha: double
