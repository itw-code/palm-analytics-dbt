version: 2

# ---------------------------------------------------------------------------
# Semantic layer: canonical metric definitions (MetricFlow-compatible spec,
# parsed by dbt-core into the manifest). The governed consumer view
# `sl_metrics_daily` is GENERATED from these definitions by
# semantic/compile_metrics.py - edit the YAML, never the SQL.
# ---------------------------------------------------------------------------

models:
  - name: metricflow_time_spine
    description: Continuous daily calendar consumed by MetricFlow / the metric compiler.
    config:
      metricflow_time_spine: true
      materialized: view
  - name: sl_metrics_daily
    description: >
      GOVERNED METRICS - GENERATED by semantic/compile_metrics.py from the
      metric registry below. Grain: (metric_name, metric_time, region_key);
      region_key is NULL for models without a region dimension.
      Edit the YAML registry, never the model.
    columns:
      - name: metric_name
        tests: [not_null]
      - name: metric_time
        tests: [not_null]
      - name: metric_value
        tests: [not_null]

semantic_models:
  - name: estate_operations
    description: >
      Daily estate operations grain (region x date) exposed as the governed
      source of harvest / water metrics.
    model: ref('fct_estate_operations_daily')
    defaults:
      agg_time_dimension: operation_date
    entities:
      - name: operations
        type: primary
        expr: operations_key
    dimensions:
      - name: operation_date
        type: time
        type_params: {time_granularity: day}
      - name: region_key
        type: categorical
    measures:
      - name: harvest_value_idr_sum
        description: Sum of IDR value generated on harvest-favorable days
        agg: sum
        expr: harvest_day_value_idr
      - name: effective_harvest_days
        description: Days where harvest is favorable AND labour is available
        agg: sum
        expr: "case when is_effective_harvest_day then 1 else 0 end"
      - name: operation_days
        description: Distinct region-day observations in the fact
        agg: count_distinct
        expr: operations_key
      - name: water_deficit_avg
        description: Average daily water deficit (ET0 - precipitation)
        agg: average
        expr: water_deficit_mm

  - name: commodity_prices
    description: >
      Daily commodity prices (palm vs soybean oil) and FX, exposed as the
      governed source of price metrics.
    model: ref('fct_commodity_price_daily')
    defaults:
      agg_time_dimension: price_date
    entities:
      - name: commodity_price
        type: primary
        expr: price_date
    dimensions:
      - name: price_date
        type: time
        type_params: {time_granularity: day}
    measures:
      - name: palm_oil_usd_avg
        description: Daily palm oil price in USD/tonne (carried forward monthly)
        agg: average
        expr: palm_oil_usd
      - name: soybean_oil_usd_avg
        description: Daily soybean oil price in USD/tonne
        agg: average
        expr: soybean_oil_usd
      - name: usd_idr_avg
        description: USD->IDR rate, forward-filled to every day
        agg: average
        expr: usd_idr

metrics:
  # ---- simple (one measure) --------------------------------------------
  - name: total_harvest_value_idr
    description: IDR value of harvest-favorable days by region and day
    type: simple
    label: Total harvest value (IDR)
    type_params:
      measure: harvest_value_idr_sum

  - name: effective_harvest_days
    description: Count of effective harvest days (favorable + labour available)
    type: simple
    label: Effective harvest days
    type_params:
      measure: effective_harvest_days

  - name: avg_water_deficit_mm
    description: Average water deficit (ET0 - precip); positive = drier than crop demand
    type: simple
    label: Avg water deficit (mm)
    type_params:
      measure: water_deficit_avg

  - name: avg_palm_price_usd
    description: Daily palm oil price in USD/tonne
    type: simple
    label: Palm oil price (USD/t)
    type_params:
      measure: palm_oil_usd_avg

  - name: avg_soybean_price_usd
    description: Daily soybean oil price in USD/tonne
    type: simple
    label: Soybean oil price (USD/t)
    type_params:
      measure: soybean_oil_usd_avg

  - name: avg_usd_idr
    description: Daily USD->IDR reference rate
    type: simple
    label: USD/IDR rate
    type_params:
      measure: usd_idr_avg

  # ---- derived (composition of metrics; single definition everywhere) ---
  - name: effective_harvest_share
    description: Share of operation-days that are effective harvest days
    type: derived
    label: Effective-harvest-day share
    type_params:
      expr: effective_harvest_days / nullif(operation_days_total, 0)
      metrics:
        - name: effective_harvest_days
        - name: operation_days_total

  - name: operation_days_total
    description: Total region-day observations (denominator for share metrics)
    type: simple
    label: Operation days
    type_params:
      measure: operation_days

  - name: avg_palm_price_idr
    description: Palm oil price in local currency (USD price x FX) - one definition
    type: derived
    label: Palm oil price (IDR/t)
    type_params:
      expr: avg_palm_price_usd * avg_usd_idr
      metrics:
        - name: avg_palm_price_usd
        - name: avg_usd_idr

  # ---- cumulative (spec showcase; executed by full MetricFlow, skipped by
  #      the OSS compiler with a documented notice) -------------------------
  - name: harvest_value_last_7_days
    description: Rolling 7-day harvest value (cumulative metric)
    type: cumulative
    label: Harvest value, trailing 7 days (IDR)
    type_params:
      measure: harvest_value_idr_sum
      window: 7 days
